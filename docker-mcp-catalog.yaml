name: godot-mcp-catalog
displayName: Godot MCP Server Catalog
description: Custom catalog for Godot debugging and code intelligence
registry:
  godot-mcp-server:
    description: "MCP server providing debugging (DAP) and code intelligence (LSP) for Godot Engine. Connect to Godot editor for breakpoints, variable inspection, stack traces, diagnostics, hover documentation, and code completion."
    title: "Godot Debug & LSP Server"
    type: "server"
    dateAdded: "2025-10-04T00:00:00Z"
    image: "ghcr.io/therossco/godot-mcp-server:latest"

    # Tools provided by this server
    tools:
      # DAP Connection
      - name: "godot_debug_connect"
        description: "Connect to Godot's debugger (DAP)"
      - name: "godot_debug_disconnect"
        description: "Disconnect from Godot's debugger"

      # LSP Connection
      - name: "godot_lsp_connect"
        description: "Connect to Godot's Language Server"
      - name: "godot_lsp_disconnect"
        description: "Disconnect from Godot's Language Server"

      # Debugging Tools
      - name: "godot_debug_list_threads"
        description: "List all running threads in Godot game"
      - name: "godot_debug_get_stacktrace"
        description: "Get current call stack for a thread"
      - name: "godot_debug_get_scopes"
        description: "Get variable scopes for a stack frame"
      - name: "godot_debug_inspect_variables"
        description: "Inspect variables in a specific scope"
      - name: "godot_debug_evaluate"
        description: "Execute GDScript expressions in running game"
      - name: "godot_debug_set_breakpoint"
        description: "Set a breakpoint at a specific line"
      - name: "godot_debug_clear_breakpoints"
        description: "Remove all breakpoints from a file"
      - name: "godot_debug_pause"
        description: "Pause game execution immediately"
      - name: "godot_debug_continue"
        description: "Resume execution after pause/breakpoint"
      - name: "godot_debug_step_over"
        description: "Execute current line, step over function calls"
      - name: "godot_debug_step_into"
        description: "Step into function calls line-by-line"
      - name: "godot_debug_step_out"
        description: "Complete current function and return to caller"

      # LSP Tools
      - name: "godot_lsp_get_errors"
        description: "Get syntax errors and warnings for GDScript files"
      - name: "godot_lsp_get_symbol_info"
        description: "Get documentation and type info for symbols"
      - name: "godot_lsp_find_definition"
        description: "Find where a symbol is defined"
      - name: "godot_lsp_autocomplete"
        description: "Get code completion suggestions"
      - name: "godot_lsp_list_symbols"
        description: "List all symbols defined in a file"
      - name: "godot_lsp_search_symbols"
        description: "Search symbols across entire workspace"
    
    # Environment variables for connecting to Godot
    env:
      - name: "GODOT_DEBUG_HOST"
        value: "{{godot-mcp-server.debug_host}}"
        description: "Host address for Godot DAP port"
      - name: "GODOT_DEBUG_PORT"
        value: "{{godot-mcp-server.debug_port}}"
        description: "Port for Godot DAP (default: 6006)"
      - name: "GODOT_LSP_HOST"
        value: "{{godot-mcp-server.lsp_host}}"
        description: "Host address for Godot LSP port"
      - name: "GODOT_LSP_PORT"
        value: "{{godot-mcp-server.lsp_port}}"
        description: "Port for Godot LSP (default: 6005)"
    
    # Configuration schema
    config:
      - name: "godot-mcp-server"
        description: "Godot MCP Server configuration"
        type: "object"
        properties:
          debug_host:
            type: "string"
            description: "Host where Godot editor is running (use host.docker.internal for Docker Desktop on localhost)"
            default: "host.docker.internal"
          debug_port:
            type: "string"
            description: "Godot Debug Adapter Protocol (DAP) port"
            default: "6006"
          lsp_host:
            type: "string"
            description: "Host where Godot editor is running (use host.docker.internal for Docker Desktop on localhost)"
            default: "host.docker.internal"
          lsp_port:
            type: "string"
            description: "Godot Language Server Protocol (LSP) port"
            default: "6005"
        required:
          - debug_host
          - debug_port
          - lsp_host
          - lsp_port
