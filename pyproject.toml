[project]
name = "godot-mcp-server"
version = "3.0.0"
description = "MCP server for Godot: editor control, game interaction, DAP debugging, and LSP code intelligence"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "godot", "debug", "dap", "lsp", "language-server"]
dependencies = [
    "mcp>=1.9.0",
    "httpx>=0.27.0",
]

[project.scripts]
godot-mcp-server = "godot_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_mcp"]
